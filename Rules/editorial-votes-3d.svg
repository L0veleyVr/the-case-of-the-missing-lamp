<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">The Case of the Missing Lamp — Editorial Board Tracker</title>
<desc id="desc">A 3D-styled dashboard summarizing five editorial votes, six open-item tracker entries, and the three-step revision-log plan.</desc>
<defs>
 <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#101a2e"/><stop offset="1" stop-color="#080e1b"/></linearGradient>
 <linearGradient id="panel" x2="0" y2="1"><stop stop-color="#293957"/><stop offset="1" stop-color="#131f35"/></linearGradient>
 <linearGradient id="blue" x2="0" y2="1"><stop stop-color="#55c5ff"/><stop offset="1" stop-color="#0872d8"/></linearGradient>
 <linearGradient id="gold" x2="0" y2="1"><stop stop-color="#ffe08a"/><stop offset="1" stop-color="#d88b12"/></linearGradient>
 <linearGradient id="red" x2="0" y2="1"><stop stop-color="#ff8888"/><stop offset="1" stop-color="#c92f46"/></linearGradient>
 <linearGradient id="green" x2="0" y2="1"><stop stop-color="#9ee9a2"/><stop offset="1" stop-color="#29975b"/></linearGradient>
 <linearGradient id="violet" x2="0" y2="1"><stop stop-color="#c6a5ff"/><stop offset="1" stop-color="#7044c7"/></linearGradient>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feGaussianBlur in="SourceAlpha" stdDeviation="12"/><feOffset dy="14"/><feComponentTransfer><feFuncA type="linear" slope=".55"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <style>
 text{font-family:Arial,Helvetica,sans-serif;fill:#f5f2ec}
 .muted{fill:#c1cce0}.small{font-size:20px}.label{font-size:22px;font-weight:700;letter-spacing:1px}
 .big{font-size:44px;font-weight:800}.head{font-size:29px;font-weight:800;letter-spacing:1px}
 .gridline{stroke:#7183a1;stroke-opacity:.35;stroke-width:2}
 </style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<path d="M0 760L1600 560V900H0Z" fill="#111b2d" opacity=".6"/>
<g filter="url(#shadow)">
 <rect x="250" y="42" width="1100" height="126" rx="26" fill="#0a1222" stroke="#405274" stroke-width="4"/>
 <rect x="250" y="34" width="1100" height="118" rx="26" fill="url(#panel)" stroke="#7186a8" stroke-width="3"/>
 <text x="800" y="105" text-anchor="middle" font-size="52" font-weight="800">THE CASE OF THE MISSING LAMP</text>
 <rect x="540" y="151" width="520" height="56" rx="18" fill="#111b2c" stroke="#536887" stroke-width="2"/>
 <text x="800" y="188" text-anchor="middle" font-size="27" font-weight="700">EDITORIAL BOARD TRACKER</text>
</g>
<!-- left panel -->
<g filter="url(#shadow)">
 <rect x="45" y="255" width="475" height="500" rx="24" fill="#080f1c" stroke="#344664" stroke-width="4"/>
 <rect x="45" y="240" width="475" height="490" rx="24" fill="url(#panel)" stroke="#5a7194" stroke-width="3"/>
 <rect x="78" y="218" width="410" height="66" rx="16" fill="url(#blue)" stroke="#8bd5ff" stroke-width="2"/>
 <text x="283" y="261" text-anchor="middle" class="head">EDITORIAL VOTES</text>
 <text x="283" y="323" text-anchor="middle" class="small muted">5 decisions recorded</text>
 <path d="M125 620H450M125 550H450M125 480H450M125 410H450" class="gridline"/>
 <path d="M125 380V620H450" stroke="#a9bad4" stroke-width="3" fill="none"/>
 <rect x="180" y="397" width="100" height="223" rx="8" fill="#0753a2" transform="translate(0 12)"/>
 <rect x="180" y="385" width="100" height="235" rx="8" fill="url(#blue)" stroke="#9adfff" stroke-width="2"/>
 <path d="M280 385l18 14v235l-18-14z" fill="#07519b"/>
 <rect x="340" y="562" width="100" height="58" rx="8" fill="url(#gold)" stroke="#ffe4a4" stroke-width="2"/>
 <path d="M440 562l18 14v58l-18-14z" fill="#a8660a"/>
 <text x="230" y="365" text-anchor="middle" class="big">4</text><text x="390" y="540" text-anchor="middle" class="big">1</text>
 <text x="230" y="675" text-anchor="middle" class="label">AGREED</text><text x="390" y="675" text-anchor="middle" class="label">OPEN</text>
 <text x="283" y="715" text-anchor="middle" class="small muted">4 agreed · 1 unresolved</text>
</g>
<!-- center panel -->
<g filter="url(#shadow)">
 <rect x="562" y="255" width="475" height="500" rx="24" fill="#080f1c" stroke="#344664" stroke-width="4"/>
 <rect x="562" y="240" width="475" height="490" rx="24" fill="url(#panel)" stroke="#5a7194" stroke-width="3"/>
 <rect x="595" y="218" width="410" height="66" rx="16" fill="url(#gold)" stroke="#ffe6aa" stroke-width="2"/>
 <text x="800" y="261" text-anchor="middle" class="head">OPEN ITEMS</text>
 <text x="800" y="323" text-anchor="middle" class="small muted">6 tracked actions</text>
 <path d="M630 620H995M630 550H995M630 480H995M630 410H995" class="gridline"/>
 <path d="M630 380V620H995" stroke="#a9bad4" stroke-width="3" fill="none"/>
 <rect x="655" y="562" width="68" height="58" rx="7" fill="url(#red)"/><path d="M723 562l14 11v58l-14-11z" fill="#85283b"/>
 <rect x="745" y="445" width="68" height="175" rx="7" fill="url(#blue)"/><path d="M813 445l14 11v175l-14-11z" fill="#07519b"/>
 <rect x="835" y="562" width="68" height="58" rx="7" fill="url(#violet)"/><path d="M903 562l14 11v58l-14-11z" fill="#51319a"/>
 <rect x="925" y="562" width="68" height="58" rx="7" fill="url(#green)"/><path d="M993 562l14 11v58l-14-11z" fill="#1e7044"/>
 <text x="689" y="540" text-anchor="middle" font-size="32" font-weight="800">1</text><text x="779" y="423" text-anchor="middle" font-size="32" font-weight="800">3</text><text x="869" y="540" text-anchor="middle" font-size="32" font-weight="800">1</text><text x="959" y="540" text-anchor="middle" font-size="32" font-weight="800">1</text>
 <text x="689" y="663" text-anchor="middle" font-size="15" font-weight="700">OPEN</text><text x="779" y="663" text-anchor="middle" font-size="15" font-weight="700">NOT STARTED</text><text x="869" y="663" text-anchor="middle" font-size="15" font-weight="700">BLOCKED</text><text x="959" y="663" text-anchor="middle" font-size="15" font-weight="700">AGREED*</text>
 <text x="800" y="710" text-anchor="middle" font-size="17" class="muted">*Agreed in principle; not committed</text>
</g>
<!-- right panel -->
<g filter="url(#shadow)">
 <rect x="1078" y="255" width="475" height="500" rx="24" fill="#080f1c" stroke="#344664" stroke-width="4"/>
 <rect x="1078" y="240" width="475" height="490" rx="24" fill="url(#panel)" stroke="#5a7194" stroke-width="3"/>
 <rect x="1111" y="218" width="410" height="66" rx="16" fill="url(#red)" stroke="#ffb0b0" stroke-width="2"/>
 <text x="1316" y="261" text-anchor="middle" class="head">REVISION LOG PLAN</text>
 <text x="1316" y="329" text-anchor="middle" class="small muted">Three-stage workflow</text>
 <path d="M1170 492H1460" stroke="#aebbd1" stroke-width="8" stroke-linecap="round"/>
 <g>
  <path d="M1140 410l28-18 112 0-28 18z" fill="#a8b5d0"/><rect x="1140" y="410" width="112" height="100" rx="8" fill="#667995" stroke="#c4d0e3" stroke-width="2"/><path d="M1252 410l28-18v100l-28 18z" fill="#455977"/>
  <path d="M1285 410l28-18 112 0-28 18z" fill="#a8b5d0"/><rect x="1285" y="410" width="112" height="100" rx="8" fill="#667995" stroke="#c4d0e3" stroke-width="2"/><path d="M1397 410l28-18v100l-28 18z" fill="#455977"/>
  <path d="M1430 410l28-18 80 0-28 18z" fill="#a8b5d0"/><rect x="1430" y="410" width="80" height="100" rx="8" fill="#667995" stroke="#c4d0e3" stroke-width="2"/><path d="M1510 410l28-18v100l-28 18z" fill="#455977"/>
 </g>
 <g font-size="18" font-weight="800" text-anchor="middle"><text x="1196" y="453">NOT</text><text x="1196" y="478">STARTED</text><text x="1341" y="453">NOT</text><text x="1341" y="478">STARTED</text><text x="1470" y="453">NOT</text><text x="1470" y="478">STARTED</text></g>
 <g fill="#f2eee5"><circle cx="1196" cy="492" r="10"/><circle cx="1341" cy="492" r="10"/><circle cx="1470" cy="492" r="10"/></g>
 <g text-anchor="middle" font-size="17" font-weight="700"><text x="1196" y="555">1. RELABEL</text><text x="1341" y="555">2. AUDIT</text><text x="1470" y="555">3. IMPLEMENT</text></g>
 <text x="1316" y="628" text-anchor="middle" class="small muted">Consensus required for story changes</text>
 <text x="1316" y="660" text-anchor="middle" class="small muted">All three editor positions must be on record</text>
 <text x="1316" y="705" text-anchor="middle" class="small muted">Director retains veto</text>
</g>
<path d="M100 820H500M1100 820H1500" stroke="#c4d0e3" stroke-width="3" opacity=".7"/>
<rect x="515" y="785" width="570" height="72" rx="20" fill="#111c30" stroke="#536887" stroke-width="3"/>
<text x="800" y="831" text-anchor="middle" font-size="25" font-weight="700">BASED ON CLAUDE'S EDITORIAL BOARD TRACKER</text>
</svg>